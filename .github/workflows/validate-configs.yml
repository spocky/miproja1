name: Validate device configurations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.12'

      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v

      - name: Run strict offline validation
        run: python tools/validate_configs.py

      - name: Check generated-file freshness
        run: python tools/generate_configs.py --check

      - name: Audit the unverified download inventory
        run: python tools/audit_catalogue.py --check
